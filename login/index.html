<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ReasonVisual - Admin Login</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23B8784E'><path d='M4 4h3l2-2h6l2 2h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2zm8 3a5 5 0 1 0 0 10 5 5 0 0 0 0-10zm0 2a3 3 0 1 1 0 6 3 3 0 0 1 0-6z'/></svg>">
  
  <!-- Sync Theme Before Paint (Default: White / Light) -->
  <script>
    if (localStorage.getItem('rv-theme') === 'dark') {
      document.documentElement.classList.add('dark');
    } else {
      document.documentElement.classList.remove('dark');
    }
  </script>

  <!-- Google Fonts & FontAwesome -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Poppins', 'system-ui', 'sans-serif'],
          },
          colors: {
            sand: {
              50: '#FDFCFA',
              100: '#F8F6F1',
              200: '#F0ECE3',
              300: '#E3DDD1',
              400: '#C4BAA6',
              500: '#A69B85',
              600: '#887D67',
              700: '#6B614D',
              800: '#4A4235',
              900: '#2C2720',
            },
            accent: {
              DEFAULT: '#B8784E',
              light: '#D4956B',
              dark: '#965F3A',
            },
          },
        },
      },
    };
  </script>

  <style>
    body {
      font-family: 'Poppins', system-ui, sans-serif;
      transition: background-color 0.3s ease, color 0.3s ease;
    }
    .ambient-glow {
      background: radial-gradient(circle at 50% 30%, rgba(184, 120, 78, 0.12) 0%, rgba(0,0,0,0) 70%);
    }

    /* Modern Custom Checkbox */
    .custom-checkbox {
      position: relative;
      display: inline-flex;
      align-items: center;
      cursor: pointer;
      user-select: none;
    }
    .custom-checkbox input {
      position: absolute;
      opacity: 0;
      width: 0;
      height: 0;
      pointer-events: none;
    }
    .custom-checkbox .checkmark-box {
      width: 18px;
      height: 18px;
      border-radius: 5px;
      border: 1.5px solid #D5CEBF;
      background-color: #FDFCFA;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      flex-shrink: 0;
    }
    .dark .custom-checkbox .checkmark-box {
      border-color: rgba(255, 255, 255, 0.2);
      background-color: #202020;
    }
    .custom-checkbox:hover .checkmark-box {
      border-color: #B8784E;
    }
    .custom-checkbox input:focus-visible + .checkmark-box {
      outline: 2px solid #B8784E;
      outline-offset: 2px;
    }
    .custom-checkbox input:checked + .checkmark-box {
      background-color: #B8784E;
      border-color: #B8784E;
    }
    .custom-checkbox .checkmark-icon {
      color: #ffffff;
      opacity: 0;
      transform: scale(0.5);
      transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .custom-checkbox input:checked + .checkmark-box .checkmark-icon {
      opacity: 1;
      transform: scale(1);
    }
  </style>
</head>
<body class="min-h-screen bg-sand-100 dark:bg-[#0E0E0E] text-sand-900 dark:text-sand-100 flex items-center justify-center p-4 relative">
  
  <!-- Background Glow -->
  <div class="absolute inset-0 ambient-glow pointer-events-none"></div>

  <!-- Main Login Card -->
  <div class="relative z-10 w-full max-w-md my-8">

    <!-- Login Box -->
    <div class="bg-white/95 dark:bg-[#161616]/90 backdrop-blur-xl border border-sand-200 dark:border-white/10 rounded-2xl p-6 sm:p-8 transition-all">
      <h2 class="text-lg font-semibold text-sand-900 dark:text-white mb-1">Masuk ke ReasonVisual CMS</h2>
      <p class="text-xs text-sand-500 dark:text-sand-400 mb-6">Kelola galeri, foto, video, dan media portofolio.</p>

      <!-- Alert Error Message -->
      <div id="login-alert" class="hidden mb-5 p-3.5 rounded-xl bg-red-500/10 border border-red-500/20 text-red-600 dark:text-red-400 text-xs flex items-center gap-2.5">
        <i class="fa-solid fa-circle-exclamation text-sm flex-shrink-0"></i>
        <span id="login-alert-text">Username atau password salah.</span>
      </div>

      <!-- Form -->
      <form id="login-form" class="space-y-4" autocomplete="off">
        <div>
          <label for="username" class="block text-xs font-semibold uppercase tracking-wider text-sand-600 dark:text-sand-400 mb-1.5">
            Username / Email
          </label>
          <div class="relative">
            <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-sand-400 dark:text-sand-500">
              <i class="fa-regular fa-user text-xs"></i>
            </span>
            <input
              type="text"
              id="username"
              required
              placeholder="admin"
              class="w-full pl-10 pr-4 py-2.5 rounded-xl bg-sand-50 dark:bg-[#202020] border border-sand-300 dark:border-white/10 text-sand-900 dark:text-white text-sm focus:ring-1 focus:ring-accent focus:border-accent outline-none transition-all placeholder-sand-400 dark:placeholder-sand-600"
            />
          </div>
        </div>

        <div>
          <label for="password" class="block text-xs font-semibold uppercase tracking-wider text-sand-600 dark:text-sand-400 mb-1.5">
            Password
          </label>
          <div class="relative">
            <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-sand-400 dark:text-sand-500">
              <i class="fa-solid fa-lock text-xs"></i>
            </span>
            <input
              type="password"
              id="password"
              required
              placeholder="••••••••••••"
              class="w-full pl-10 pr-10 py-2.5 rounded-xl bg-sand-50 dark:bg-[#202020] border border-sand-300 dark:border-white/10 text-sand-900 dark:text-white text-sm focus:ring-1 focus:ring-accent focus:border-accent outline-none transition-all placeholder-sand-400 dark:placeholder-sand-600"
            />
            <button
              type="button"
              id="toggle-password"
              class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-sand-400 hover:text-sand-600 dark:text-sand-500 dark:hover:text-sand-300 transition-colors"
            >
              <i class="fa-regular fa-eye text-xs"></i>
            </button>
          </div>
        </div>

        <!-- Custom Styled Remember Me Checkbox -->
        <div class="flex items-center justify-between pt-1">
          <label class="custom-checkbox inline-flex items-center gap-2.5 cursor-pointer select-none group">
            <input type="checkbox" id="remember-me" checked />
            <div class="checkmark-box">
              <svg class="checkmark-icon w-3 h-3 text-white fill-none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="20 6 9 17 4 12"></polyline>
              </svg>
            </div>
            <span class="text-xs text-sand-600 dark:text-sand-400 group-hover:text-sand-900 dark:group-hover:text-white transition-colors">Ingat Saya</span>
          </label>
        </div>

        <button
          type="submit"
          id="btn-submit"
          class="w-full mt-2 py-3 rounded-xl bg-accent hover:bg-accent-light text-white font-semibold text-sm tracking-wide transition-all flex items-center justify-center"
        >
          <span>Masuk</span>
        </button>
      </form>
    </div>

    <!-- Back to website link -->
    <div class="text-center mt-6">
      <a href="../" class="text-xs text-sand-600 dark:text-sand-400 hover:text-sand-900 dark:hover:text-white transition-colors inline-flex items-center gap-2">
        <i class="fa-solid fa-arrow-left text-[10px]"></i>
        <span>Kembali ke Website Utama</span>
      </a>
    </div>

  </div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../assets/js/supabase-config.js"></script>
  <script>
    const form = document.getElementById('login-form');
    const usernameInput = document.getElementById('username');
    const passwordInput = document.getElementById('password');
    const rememberMeInput = document.getElementById('remember-me');
    const alertBox = document.getElementById('login-alert');
    const alertText = document.getElementById('login-alert-text');
    const btnSubmit = document.getElementById('btn-submit');
    const togglePassBtn = document.getElementById('toggle-password');

    // Periksa status lockout brute-force saat halaman dimuat
    function checkLockout() {
      if (!window.AdminAuth) return;
      const lockout = window.AdminAuth.getLockoutStatus();
      if (lockout.isLocked) {
        btnSubmit.disabled = true;
        usernameInput.disabled = true;
        passwordInput.disabled = true;
        btnSubmit.classList.add('opacity-50', 'cursor-not-allowed');
        alertBox.classList.remove('hidden');
        alertText.textContent = `Akun terkunci sementara karena 5x salah password. Coba lagi dalam ${Math.ceil(lockout.remainingSec / 60)} menit (${lockout.remainingSec} detik).`;

        const interval = setInterval(() => {
          const current = window.AdminAuth.getLockoutStatus();
          if (!current.isLocked) {
            clearInterval(interval);
            btnSubmit.disabled = false;
            usernameInput.disabled = false;
            passwordInput.disabled = false;
            btnSubmit.classList.remove('opacity-50', 'cursor-not-allowed');
            alertBox.classList.add('hidden');
          } else {
            alertText.textContent = `Akun terkunci sementara karena 5x salah password. Coba lagi dalam ${Math.ceil(current.remainingSec / 60)} menit (${current.remainingSec} detik).`;
          }
        }, 1000);
      }
    }

    // Cek jika sudah login sebelumnya, langsung arahkan ke /admin
    (async function checkExistingSession() {
      checkLockout();
      if (window.AdminAuth) {
        const isLogged = await window.AdminAuth.isLoggedIn();
        if (isLogged) {
          window.location.href = '../admin/';
        }
      }
    })();

    // Toggle Password Visibility
    togglePassBtn.addEventListener('click', () => {
      const isPassword = passwordInput.getAttribute('type') === 'password';
      passwordInput.setAttribute('type', isPassword ? 'text' : 'password');
      togglePassBtn.innerHTML = isPassword 
        ? '<i class="fa-regular fa-eye-slash text-xs"></i>' 
        : '<i class="fa-regular fa-eye text-xs"></i>';
    });

    // Handle Form Submit (Async Supabase Auth + Rate Limiting)
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      alertBox.classList.add('hidden');

      const username = usernameInput.value.trim();
      const password = passwordInput.value.trim();
      const remember = rememberMeInput ? rememberMeInput.checked : true;

      btnSubmit.disabled = true;
      btnSubmit.innerHTML = '<i class="fa-solid fa-spinner fa-spin text-xs mr-2"></i><span>Memeriksa keamanan...</span>';

      try {
        const result = await window.AdminAuth.login(username, password, remember);
        if (result.success) {
          btnSubmit.innerHTML = '<i class="fa-solid fa-check text-xs mr-2"></i><span>Berhasil Masuk!</span>';
          btnSubmit.classList.remove('bg-accent', 'hover:bg-accent-light');
          btnSubmit.classList.add('bg-emerald-600');
          setTimeout(() => {
            window.location.href = '../admin/';
          }, 350);
        } else {
          btnSubmit.disabled = false;
          btnSubmit.innerHTML = '<span>Masuk</span>';
          alertText.textContent = result.message || 'Email atau password yang Anda masukkan salah.';
          alertBox.classList.remove('hidden');
          passwordInput.value = '';
          passwordInput.focus();
          checkLockout();
        }
      } catch (err) {
        console.error(err);
        btnSubmit.disabled = false;
        btnSubmit.innerHTML = '<span>Masuk</span>';
        alertText.textContent = 'Terjadi kesalahan sistem autentikasi.';
        alertBox.classList.remove('hidden');
      }
    });
  </script>
</body>
</html>
